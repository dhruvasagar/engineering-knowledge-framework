{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .Description }}
<p class="description">{{ .Description }}</p>
{{ end }}
<div class="content">
  {{ .Content }}
</div>

{{ if .Pages }}
<h2>Documents</h2>
<ul class="document-list">
  {{ range .Pages.ByTitle }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ if .Description }} — {{ .Description }}{{ end }}</li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
